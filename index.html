<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-gltf-model
        position="0 0 -4"
        scale="0.5 0.5 0.5"
        src="m0.glb"

      <a-box
        position="0 1 -6"
        rotation="0 0 0"

        rotation="-90 0 0"
        width="4"

        color="#7BC8A4"

      <a-sky color="#888888"></a-sky>

</html>
